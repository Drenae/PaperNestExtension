[project]
name = "papernestextension"
version = "1.1.0"
description = "A premium, enterprise-grade document classification and smart archiving ecosystem built with Flet."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PaperNest Developer", email = "developer@papernest.io" }
]
dependencies = [
    "flet>=0.85.3",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://mydomain.dev"
Documentation = "https://github.com/MyGithubAccount/papernestextension"
Repository = "https://github.com/MyGithubAccount/papernestextension"
Issues = "https://github.com/MyGithubAccount/papernestextension/issues"

[tool.setuptools.package-data]
"flutter.papernestextension" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
